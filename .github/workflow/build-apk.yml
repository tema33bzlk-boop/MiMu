      - name: Extract MiMu source
        run: |
          unzip -o MiMu-1.5.0-source.zip -d source

      - name: Build APK
        run: |
          cd source/MiMu
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMu-1.5.0-APK
          path: source/MiMu/app/build/outputs/apk/debug/*.apk
