name: MiMu Player 1.5.0 APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: mimu-150-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract, validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . \
            -path './.git' -prune -o \
            -type f -iname '*.zip' -print | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found in repository."
            echo "Upload the MiMu source ZIP and commit it."
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/mimu-source"

          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/mimu-source"

          echo "=== Extracted project files ==="

          find "$RUNNER_TEMP/mimu-source" \
            -type f \( \
              -name gradlew -o \
              -name settings.gradle -o \
              -name settings.gradle.kts \
            \) -print

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/mimu-source"

          SETTINGS="$(find "$ROOT" \
            -type f \( \
              -name settings.gradle -o \
              -name settings.gradle.kts \
            \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::gradlew not found in project directory."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project located: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses

      - name: Validate project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

          echo "Android project validation complete."

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon clean

      - name: Build MiMu debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found."
            exit 1
          fi

          APK="$(find "$APK_DIR" -maxdepth 1 \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "Build successful!"
          ls -lh "$APK"
          file "$APK"

      - name: Upload MiMu APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMu-Player-1.5.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiMu-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
