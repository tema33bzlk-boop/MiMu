
name: Build MiMu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          if [ -f "MiMu-1.3.0-source.zip" ]; then
            unzip -o MiMu-1.3.0-source.zip -d source
          else
            echo "ERROR: MiMu-1.3.0-source.zip not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

      - name: Build APK
        run: |
          cd source
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMu-1.3.0-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
