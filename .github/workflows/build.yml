
name: Build MiMu APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiMu-Android-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          unzip -o MiMu-Android-Source.zip -d source
          find source -name gradlew -type f

      - name: Build APK
        run: |
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/source" -name gradlew -type f | head -n 1)")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMu-debug-APK
          path: source/**/build/outputs/apk/**/*.apk
          
