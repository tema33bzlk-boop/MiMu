
name: VOSQEN 2.0.0 — Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build VOSQEN APK and ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Получение исходников
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Проверка структуры проекта
      - name: Check project files
        shell: bash
        run: |
          echo "Checking project structure..."

          if [ ! -f gradlew ]; then
            echo "::error::gradlew not found in repository root"
            exit 1
          fi

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          if [ ! -d app ]; then
            echo "::error::app directory not found"
            exit 1
          fi

          echo "Project structure OK"

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # 5. Gradle permissions
      - name: Prepare Gradle
        run: |
          chmod +x gradlew
          ./gradlew --version

      # 6. Static validation
      - name: Validate project
        shell: bash
        run: |
          if [ -f tools/verify-project.sh ]; then
            chmod +x tools/verify-project.sh
            bash tools/verify-project.sh
          else
            echo "No custom verification script found; continuing."
          fi

      # 7. Build and test
      - name: Build Debug APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            testDebugUnitTest \
            assembleDebug

      # 8. Verify APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/VOSQEN-2.0.0.apk

          echo "APK successfully generated"

      # 9. Create source ZIP
      - name: Create source archive
        run: |
          zip -r release/VOSQEN-2.0.0-source.zip . \
            -x ".git/*" \
               ".gradle/*" \
               "*/build/*" \
               "release/*"

      # 10. Create combined release ZIP
      - name: Create full release ZIP
        run: |
          cd release

          zip VOSQEN-2.0.0-RELEASE.zip \
            VOSQEN-2.0.0.apk \
            VOSQEN-2.0.0-source.zip

      # 11. Verify all archives
      - name: Verify release archives
        run: |
          test -s release/VOSQEN-2.0.0.apk
          test -s release/VOSQEN-2.0.0-source.zip
          test -s release/VOSQEN-2.0.0-RELEASE.zip

          unzip -t release/VOSQEN-2.0.0-source.zip
          unzip -t release/VOSQEN-2.0.0-RELEASE.zip

          echo "All release files verified"

      # 12. Upload artifacts
      - name: Upload VOSQEN Release
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-2.0.0-FULL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30
          
