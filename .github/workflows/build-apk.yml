
name: VOSQEN Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          WRAPPER=$(find . \
            -type f \
            -name gradlew \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          PROJECT_DIR=${PROJECT_DIR#./}

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=""
          fi

          ROOT="$GITHUB_WORKSPACE/$PROJECT_DIR"

          if [ ! -f "$ROOT/settings.gradle" ] && \
             [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found beside gradlew."
            find "$ROOT" -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
          echo "Gradle wrapper: $WRAPPER"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --no-daemon --version

          ./gradlew --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/$PROJECT_DIR"

          APK=$(find "$ROOT" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -not -path '*/androidTest/*' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$ROOT" -type f -name "*.apk"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/VOSQEN.apk"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK successfully found: $APK"

      - name: Create source ZIP
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/release"

          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          zip -r "$GITHUB_WORKSPACE/release/VOSQEN-source.zip" . \
            -x "*/.git/*" \
               "*/.gradle/*" \
               "*/build/*" \
               "*/.idea/*" \
               "*/local.properties" \
               "*.apk"

      - name: Create complete release ZIP
        run: |
          cd "$GITHUB_WORKSPACE/release"

          zip VOSQEN-release.zip \
            VOSQEN.apk \
            VOSQEN-source.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-APK
          path: release/VOSQEN.apk
          if-no-files-found: error

      - name: Upload source code
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-Source
          path: release/VOSQEN-source.zip
          if-no-files-found: error

      - name: Upload complete release
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-Complete-Release
          path: release/VOSQEN-release.zip
          if-no-files-found: error
          
