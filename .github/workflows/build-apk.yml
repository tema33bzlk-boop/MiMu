name: Build MiMu APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Extract source
        run: unzip -oq MiMu-1.5.0-source.zip -d source

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Build APK
        run: |
          cd source/MiMu
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MiMu-1.5.0-APK
          path: source/MiMu/app/build/outputs/apk/debug/*.apk
