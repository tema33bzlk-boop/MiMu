
name: Build MiMu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP source
        run: |
          set -eu

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'MiMu-1.3.0-source.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MiMu-1.3.0-source.zip not found!"
            echo "Files in repository:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/mimu-src"
          unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/mimu-src"

          echo "ZIP extracted successfully."

      - name: Locate Gradle project
        run: |
          set -eu

          GRADLEW="$(find "$GITHUB_WORKSPACE/mimu-src" \
            -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP!"
            find "$GITHUB_WORKSPACE/mimu-src" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          set -eu
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMu-1.3.0-APK
          path: mimu-src/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
