name: Build MiMu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare MiMu source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$RUNNER_TEMP/mimu-source"
          mkdir -p "$SOURCE_DIR"

          ARCHIVE="$GITHUB_WORKSPACE/MiMu-1.3.0-source.zip"

          if [ -f "$ARCHIVE" ]; then
            echo "Extracting MiMu source archive..."
            unzip -oq "$ARCHIVE" -d "$SOURCE_DIR"

            PROJECT_DIR="$(find "$SOURCE_DIR" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit | xargs -r dirname)"
          elif [ -f "$GITHUB_WORKSPACE/gradlew" ] && \
               [ -d "$GITHUB_WORKSPACE/app" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            echo "::error::MiMu source archive or Android project not found."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          if [ -z "${PROJECT_DIR:-}" ] || \
             [ ! -f "$PROJECT_DIR/gradlew" ] || \
             [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Incomplete Android Gradle project."
            find "$SOURCE_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Find and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/*' | head -100
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/dist/MiMu-debug.apk"

          echo "APK successfully collected:"
          ls -lh "$GITHUB_WORKSPACE/dist/MiMu-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiMu-debug-APK
          path: dist/MiMu-debug.apk
          if-no-files-found: error
          retention-days: 7
