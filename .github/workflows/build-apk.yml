
name: VOSQEN Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract VOSQEN source
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="VOSQEN-2.0.0-source.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: $SOURCE_ZIP not found."
            find . -maxdepth 3 -type f -iname "*.zip"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vosqen-source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/vosqen-source"

          echo "Source extracted successfully."

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SEARCH_DIR="$RUNNER_TEMP/vosqen-source"

          WRAPPER=$(find "$SEARCH_DIR" \
            -type f \
            -name gradlew \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found inside source ZIP."
            find "$SEARCH_DIR" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_DIR"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses

          "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build VOSQEN APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --no-daemon --version

          ./gradlew --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -not -path '*/androidTest/*' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/VOSQEN.apk"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK successfully created."

      - name: Create source ZIP
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          zip -r "$GITHUB_WORKSPACE/release/VOSQEN-source.zip" . \
            -x "*/.git/*" \
               "*/.gradle/*" \
               "*/build/*" \
               "*/.idea/*" \
               "*/local.properties" \
               "*.apk"

      - name: Create complete release ZIP
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/release"

          zip VOSQEN-release.zip \
            VOSQEN.apk \
            VOSQEN-source.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-APK
          path: release/VOSQEN.apk
          if-no-files-found: error

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-Source
          path: release/VOSQEN-source.zip
          if-no-files-found: error

      - name: Upload complete release
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-Complete-Release
          path: release/VOSQEN-release.zip
          if-no-files-found: error
          
