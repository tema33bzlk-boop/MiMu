
name: Build VOSQEN APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: unzip -o VOSQEN-2.0.0-source.zip -d source

      - name: Build APK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager not found in Android SDK"
              exit 1
            fi
          else
            SDKMANAGER=$(command -v sdkmanager)
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

          WRAPPER=$(find "$GITHUB_WORKSPACE/source" -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew not found in source ZIP"
            exit 1
          fi

          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
