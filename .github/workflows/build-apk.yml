
name: VOSQEN 2.0.0 — Build Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Validate project
        run: |
          chmod +x gradlew
          chmod +x tools/verify-project.sh
          ./tools/verify-project.sh

      - name: Build APK
        run: |
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully built"

      - name: Prepare release
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
            release/VOSQEN-2.0.0.apk

      - name: Create source ZIP
        run: |
          zip -r release/VOSQEN-2.0.0-source.zip . \
            -x './.git/*' \
               './.gradle/*' \
               './**/build/*' \
               './release/*'

      - name: Create combined release ZIP
        run: |
          cd release
          zip VOSQEN-2.0.0-RELEASE.zip \
            VOSQEN-2.0.0.apk \
            VOSQEN-2.0.0-source.zip

      - name: Verify release files
        run: |
          test -s release/VOSQEN-2.0.0.apk
          test -s release/VOSQEN-2.0.0-source.zip
          test -s release/VOSQEN-2.0.0-RELEASE.zip
          unzip -t release/VOSQEN-2.0.0-RELEASE.zip

      - name: Upload all release files
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-2.0.0-FULL-RELEASE
          path: release/*
          if-no-files-found: error
          retention-days: 30
          
