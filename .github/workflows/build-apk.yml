
name: Build VOSQEN APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          unzip -o VOSQEN-2.0.0-source.zip -d source

      - name: Build APK
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

          WRAPPER=$(find "$GITHUB_WORKSPACE/source" -name gradlew -type f | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "gradlew not found"
            exit 1
          fi

          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOSQEN-APK
          path: source/**/build/outputs/apk/**/*.apk
          
